<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Avatar Jet vs Tanks - Multiplayer Arena</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:Arial,sans-serif; }
#game { display:block; width:100%; height:100%; touch-action:none; }

#hud {
    position:fixed; top:0; left:0; width:100%; padding:10px 15px;
    display:flex; justify-content:space-between; align-items:flex-start;
    color:#fff; font-size:14px; pointer-events:none; text-shadow:1px 1px 2px #000;
    z-index:10;
}
#hud .level { font-size:16px; font-weight:bold; color:#ffe94d; }

#bigmsg {
    position:fixed; top:35%; left:50%; transform:translate(-50%,-50%);
    color:#ffe94d; font-size:22px; font-weight:bold; text-align:center;
    text-shadow:0 0 10px #000, 0 0 6px #000; pointer-events:none;
    width:90%; line-height:1.4; z-index:12; white-space:pre-line;
}

/* CỤM ĐIỀU KHIỂN WASD + TỐC ĐỘ */
.pad { position:fixed; bottom:18px; z-index:20; }
#padLeft { left:16px; width:160px; height:160px; }

.btn {
    position:absolute; display:flex; align-items:center; justify-content:center;
    border-radius:12px; font-weight:bold; color:#fff; font-size:16px;
    background:rgba(255,255,255,0.15); border:2px solid rgba(255,255,255,0.5);
    backdrop-filter:blur(2px); touch-action:none; cursor:pointer;
}
.btn:active, .btn.active { background:rgba(255,233,77,0.55); border-color:#ffe94d; }

#btnW { top:0; left:55px; width:50px; height:50px; }
#btnA { top:50px; left:0; width:50px; height:50px; }
#btnS { top:50px; left:55px; width:50px; height:50px; }
#btnD { top:50px; left:110px; width:50px; height:50px; }
#btnSpeedUp   { top:110px; left:0; width:75px; height:45px; font-size:13px; background:rgba(0,255,200,0.2); border-color:#00ffc8; }
#btnSpeedDown { top:110px; left:85px; width:75px; height:45px; font-size:13px; background:rgba(255,100,100,0.2); border-color:#ff6464; }

#btnFire {
    position:fixed; right:16px; bottom:18px; width:110px; height:110px;
    border-radius:50%; font-size:20px; font-weight:bold; color:#fff;
    background:rgba(255,60,60,0.35); border:3px solid rgba(255,80,80,0.9);
    display:flex; align-items:center; justify-content:center;
    touch-action:none; z-index:20; cursor:pointer; text-shadow:1px 1px 2px #000;
}
#btnFire:active, #btnFire.active { background:rgba(255,60,60,0.75); }

/* RADAR GÓC TRÊN PHẢI */
#radar {
    position: fixed; top: 12px; right: 12px; width: 120px; height: 120px;
    background: rgba(0, 20, 40, 0.8); border: 2px solid #00ffcc; border-radius: 50%;
    overflow: hidden; pointer-events: none; z-index: 15; box-shadow: 0 0 10px rgba(0,255,204,0.3);
}

/* BẢNG XẾP HẠNG ONLINE ĐỘNG NGAY DƯỚI RADAR */
#leaderboard {
    position: fixed; top: 140px; right: 12px; width: 175px;
    background: rgba(0, 20, 40, 0.9); border: 2px solid #00ffcc; border-radius: 8px;
    padding: 8px; font-size: 11px; color: #fff; z-index: 15; pointer-events: none;
    box-shadow: 0 0 10px rgba(0,255,204,0.3); text-align: left; max-height: 180px; overflow-y: auto;
}
.lb-row { display: flex; justify-content: space-between; margin-bottom: 3px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2px; }

/* OVERLAY SẢNH CHỜ */
#overlay {
    position:fixed; inset:0; background:rgba(10,25,40,0.96);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:20px; z-index:50; overflow-y:auto;
}
#overlay h1 { font-size:24px; color:#ffe94d; margin-bottom:10px; }
.class-grid { display:flex; gap:12px; margin:12px 0; flex-wrap:wrap; justify-content:center; }
.class-card {
    border:2px solid #444; background:#152238; padding:12px; border-radius:10px;
    cursor:pointer; text-align:center; width:150px; transition:0.2s;
}
.class-card.selected { border-color:#00ffcc; background:#1e3557; box-shadow:0 0 12px rgba(0,255,204,0.4); }
#overlay input { padding:8px; font-size:15px; width:200px; text-align:center; border-radius:8px; border:none; margin:8px 0; }

.mode-buttons { display:flex; gap:15px; margin-top:15px; }
.mode-btn {
    padding:12px 24px; font-size:16px; font-weight:bold; border:none; border-radius:10px; cursor:pointer;
}
#btnTraining { background:#f39c12; color:#fff; }
#btnMulti { background:#2ecc71; color:#fff; box-shadow:0 0 10px rgba(46,204,113,0.5); }
</style>
<script src="/socket.io/socket.io.js"></script>
</head>
<body>

<canvas id="game"></canvas>
<canvas id="radar" width="120" height="120"></canvas>

<!-- BẢNG XẾP HẠNG ĐỘNG ONLINE -->
<div id="leaderboard">
    <div style="font-weight:bold; color:#ffe94d; border-bottom:1px solid rgba(255,255,255,0.3); padding-bottom:3px; margin-bottom:5px; text-align:center;">🏆 BẢNG XẾP HẠNG</div>
    <div id="lbContent">
        <div class="lb-row"><span>Ghost_99</span><span style="color:#00ffc8;">0 đ</span></div>
    </div>
</div>

<div id="hud">
    <div class="left"><div class="level">CẤP ĐỘ: <span id="levelTxt">1</span></div></div>
</div>

<div id="bigmsg"></div>

<div class="pad" id="padLeft">
    <div class="btn" id="btnW">W</div>
    <div class="btn" id="btnA">A</div>
    <div class="btn" id="btnS">S</div>
    <div class="btn" id="btnD">D</div>
    <div class="btn" id="btnSpeedUp">➕ TỐC</div>
    <div class="btn" id="btnSpeedDown">➖ TỐC</div>
</div>

<div id="btnFire">FIRE</div>

<div id="overlay">
    <h1>🌐 CHỌN QUỐC GIA & PHI THUYỀN AVATAR</h1>
    <p style="font-size:13px; color:#aaa;">Chọn màu sắc quốc gia biểu trưng cho phi thuyền của bạn</p>
    
    <div class="class-grid">
        <div class="class-card selected" onclick="selectCountry('VN', '#da251d', '#ffeb00', this)">
            <h3 style="color:#ffeb00; font-size:14px;">🇻🇳 Việt Nam</h3>
            <p style="font-size:10px; color:#88a;">Đỏ cờ sắc vàng</p>
        </div>
        <div class="class-card" onclick="selectCountry('USA', '#3c3b6e', '#b22234', this)">
            <h3 style="color:#38bdf8; font-size:14px;">🇺🇸 Hợp Chủng Quốc</h3>
            <p style="font-size:10px; color:#88a;">Xanh dương & Đỏ</p>
        </div>
        <div class="class-card" onclick="selectCountry('JP', '#bc002d', '#ffffff', this)">
            <h3 style="color:#fff; font-size:14px;">🇯🇵 Nhật Bản</h3>
            <p style="font-size:10px; color:#88a;">Mặt trời đỏ - trắng</p>
        </div>
    </div>

    <input type="text" id="playerNameInput" placeholder="Nhập tên phi công..." value="Ghost_99"><br>
    
    <div class="mode-buttons">
        <button class="mode-btn" id="btnTraining" onclick="startGame('training')">🪖 HUẤN LUYỆN ĐƠN</button>
        <button class="mode-btn" id="btnMulti" onclick="startGame('multi')">🌐 THỰC CHIẾN ĐỒNG ĐỘI</button>
    </div>
</div>

<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const radarCanvas = document.getElementById('radar');
const radarCtx = radarCanvas.getContext('2d');

let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

let selectedCountry = 'VN';
let primaryColor = '#da251d';
let secondaryColor = '#ffeb00';
let playerName = 'Ghost_99';
let gameMode = 'training';
let socket = null;
let otherPlayers = {};

function selectCountry(code, pColor, sColor, el) {
    document.querySelectorAll('.class-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedCountry = code;
    primaryColor = pColor;
    secondaryColor = sColor;
}

const WORLD_WIDTH = 3500;
const WORLD_HEIGHT = 3500;
let baseIsland = { x: WORLD_WIDTH/2, y: WORLD_HEIGHT/2, r: 160 };

const mountains = [
    { x: 1000, y: 1000, r: 220 },
    { x: 2600, y: 1000, r: 250 },
    { x: 1000, y: 2600, r: 200 },
    { x: 2600, y: 2600, r: 240 }
];

const lakes = [
    { x: 1800, y: 800, r: 180 },
    { x: 900, y: 1800, r: 150 },
    { x: 2500, y: 2000, r: 170 }
];

let helicopter = null;
let tanks = [];
let bullets = [];
let tBullets = [];
let particles = [];
let fireTimer = 0;
let killsCount = 0;

const state = { running: false, level: 1, flowStarted: false };

let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function beep(freq, dur, type, vol) {
    if (!audioCtx) return;
    try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type || 'square';
        o.frequency.value = freq;
        o.connect(g); g.connect(audioCtx.destination);
        const t = audioCtx.currentTime;
        g.gain.setValueAtTime(vol || 0.05, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.start(t); o.stop(t + dur);
    } catch(e){}
}

function makeHelicopter() {
    return {
        x: baseIsland.x, y: baseIsland.y,
        angle: -Math.PI / 2,
        speed: 0,
        maxSpeed: 1.5,
        size: 26,
        hp: 100,
        maxHp: 100,
        landed: true,
        name: playerName,
        primaryColor: primaryColor,
        secondaryColor: secondaryColor
    };
}

function spawnTanks(n) {
    for (let i = 0; i < n; i++) {
        let tankLevelBonus = Math.min(state.level, 5);
        tanks.push({
            x: Math.random() * (WORLD_WIDTH - 600) + 300,
            y: Math.random() * (WORLD_HEIGHT - 600) + 300,
            angle: Math.random() * Math.PI * 2,
            speed: 0.6 + (tankLevelBonus * 0.1),
            size: 22,
            alive: true,
            color: i % 2 === 0 ? '#c0392b' : '#2c3e50',
            turretAngle: 0,
            hp: 2 + Math.floor(tankLevelBonus / 2),
            maxHp: 2 + Math.floor(tankLevelBonus / 2),
            shootTimer: Math.random() * 2
        });
    }
}

// HỆ SỐ CẤP ĐỘ VÀ PHÂN THÂN
function getLevelParameters(lvl) {
    let baseLevel = ((lvl - 1) % 3) + 1;
    let firePowerMultiplier = 0.7 + (baseLevel - 1) * 0.1;
    
    let wingmanCount = 0;
    if (lvl >= 10) {
        wingmanCount = 3 + Math.floor((lvl - 10) / 3);
    } else if (lvl >= 7) {
        wingmanCount = 2;
    } else if (lvl >= 4) {
        wingmanCount = 1;
    } else {
        wingmanCount = 0;
    }
    
    return {
        firePower: firePowerMultiplier,
        wingman: wingmanCount
    };
}

// BẮN ĐẠN THEO CẤP ĐỘ & PHÂN THÂN
function shootBullet() {
    if (!helicopter || helicopter.landed) return;
    if (fireTimer > 0) return;
    fireTimer = (state.level >= 3) ? 0.09 : 0.18;

    let config = getLevelParameters(state.level);
    let wingmanCount = config.wingman;
    let spawnPoints = [];

    const b = helicopter.size + 10;
    let mainX = helicopter.x + Math.cos(helicopter.angle) * b;
    let mainY = helicopter.y + Math.sin(helicopter.angle) * b;
    spawnPoints.push({ x: mainX, y: mainY });

    // Thêm vị trí phân thân nếu có từ cấp độ 4 trở lên
    if (wingmanCount >= 1) {
        let perp = helicopter.angle + Math.PI / 2;
        spawnPoints.push({
            x: helicopter.x - Math.cos(helicopter.angle) * 25 + Math.cos(perp) * 45,
            y: helicopter.y - Math.sin(helicopter.angle) * 25 + Math.sin(perp) * 45
        });
    }
    if (wingmanCount >= 2) {
        let perp = helicopter.angle + Math.PI / 2;
        spawnPoints.push({
            x: helicopter.x - Math.cos(helicopter.angle) * 25 - Math.cos(perp) * 45,
            y: helicopter.y - Math.sin(helicopter.angle) * 25 - Math.sin(perp) * 45
        });
    }
    if (wingmanCount >= 3) {
        spawnPoints.push({
            x: helicopter.x - Math.cos(helicopter.angle) * 60,
            y: helicopter.y - Math.sin(helicopter.angle) * 60
        });
    }

    // Bắn đạn từ máy bay chính và các phân thân đồng loạt
    for (let pt of spawnPoints) {
        if (state.level === 1) {
            bullets.push({
                x: pt.x, y: pt.y,
                vx: Math.cos(helicopter.angle) * 850,
                vy: Math.sin(helicopter.angle) * 850,
                life: 1.5, r: 4
            });
        } else if (state.level === 2) {
            let angles = [helicopter.angle, helicopter.angle - 0.2, helicopter.angle + 0.2];
            for (let a of angles) {
                bullets.push({
                    x: pt.x, y: pt.y,
                    vx: Math.cos(a) * 850,
                    vy: Math.sin(a) * 850,
                    life: 1.5, r: 4
                });
            }
        } else {
            let offset = 8;
            let perpAngle = helicopter.angle + Math.PI / 2;
            bullets.push({
                x: pt.x + Math.cos(perpAngle) * offset, y: pt.y + Math.sin(perpAngle) * offset,
                vx: Math.cos(helicopter.angle) * 900, vy: Math.sin(helicopter.angle) * 900,
                life: 1.5, r: 4
            });
            bullets.push({
                x: pt.x - Math.cos(perpAngle) * offset, y: pt.y - Math.sin(perpAngle) * offset,
                vx: Math.cos(helicopter.angle) * 900, vy: Math.sin(helicopter.angle) * 900,
                life: 1.5, r: 4
            });
        }
    }

    beep(1200, 0.06, 'sawtooth', 0.05);

    if (socket && socket.connected) {
        socket.emit('player_shoot', { x: helicopter.x, y: helicopter.y, angle: helicopter.angle });
    }
}

let last = 0;
function loop(ts) {
    if (!last) last = ts;
    let dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.05) dt = 0.05;

    if (isFiring && state.running && helicopter && !helicopter.landed) {
        if (fireTimer <= 0) {
            shootBullet();
        }
    }

    update(dt);
    render();
    drawRadar();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function update(dt) {
    if (!state.running) return;
    if (fireTimer > 0) fireTimer -= dt;

    if (helicopter) {
        let h = helicopter;
        if (!h.landed) {
            if (input.left) h.angle -= 2.3 * dt;
            if (input.right) h.angle += 2.3 * dt;

            let worldSpeed = 190 * h.speed;
            h.x += Math.cos(h.angle) * worldSpeed * dt;
            h.y += Math.sin(h.angle) * worldSpeed * dt;

            h.x = Math.max(50, Math.min(WORLD_WIDTH - 50, h.x));
            h.y = Math.max(50, Math.min(WORLD_HEIGHT - 50, h.y));

            if (socket && socket.connected) {
                socket.emit('player_move', {
                    x: h.x, y: h.y, angle: h.angle, level: state.level, hp: h.hp, kills: killsCount,
                    primaryColor: h.primaryColor, secondaryColor: h.secondaryColor
                });
            }
        }

        if (h.landed && input.firePressed) {
            h.landed = false;
            h.speed = 0.6;
            input.firePressed = false;
            beep(750, 0.15, 'triangle', 0.08);
            if (!state.flowStarted) {
                state.flowStarted = true;
                spawnTanks(4 + state.level * 2);
                showMsg('🎯 Cấp độ ' + state.level + ': Tiêu diệt xe tăng địch, cẩn thận đạn pháo!', 2.5);
            }
        }
    }

    // Cập nhật Tank địch & Tấn công người chơi (Đã cân bằng hỏa lực qua getLevelParameters)
    for (let t of tanks) {
        if (!t.alive || !helicopter) continue;
        let angleToPl = Math.atan2(helicopter.y - t.y, helicopter.x - t.x);
        t.turretAngle = angleToPl;

        t.shootTimer -= dt;
        if (t.shootTimer <= 0) {
            let config = getLevelParameters(state.level);
            let fireInterval = Math.max(1.0, (1.8 - (state.level * 0.15)) / config.firePower);
            t.shootTimer = fireInterval + Math.random() * 0.8;
            
            let bulletSpeed = (380 + state.level * 20) * config.firePower;
            tBullets.push({
                x: t.x, y: t.y,
                vx: Math.cos(angleToPl) * bulletSpeed,
                vy: Math.sin(angleToPl) * bulletSpeed,
                life: 2.5, r: 4
            });
            beep(300, 0.08, 'sawtooth', 0.04);
        }

        let nextX = t.x + Math.cos(angleToPl) * t.speed;
        let nextY = t.y + Math.sin(angleToPl) * t.speed;
        let avoidAngle = angleToPl;

        for (let lake of lakes) {
            if (Math.hypot(nextX - lake.x, nextY - lake.y) < lake.r + 35) {
                avoidAngle += Math.PI / 2;
            }
        }

        t.angle = avoidAngle;
        t.x += Math.cos(t.angle) * t.speed;
        t.y += Math.sin(t.angle) * t.speed;
    }

    // Xử lý đạn của người chơi bắn tank
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
        if (b.life <= 0) { bullets.splice(i, 1); continue; }

        for (let t of tanks) {
            if (t.alive && Math.hypot(b.x - t.x, b.y - t.y) < t.size + b.r) {
                bullets.splice(i, 1);
                t.hp--;
                
                if (t.hp <= 0) {
                    t.alive = false;
                    burst(t.x, t.y, '#ff4444', 18);
                    beep(180, 0.25, 'sine', 0.1);
                    tanks = tanks.filter(item => item !== t);
                    killsCount++;

                    let allEnemiesDead = tanks.length === 0;
                    if (allEnemiesDead) {
                        state.level++;
                        document.getElementById('levelTxt').textContent = state.level;
                        showMsg('🎉 HOÀN THÀNH! LÊN CẤP ĐỘ ' + state.level + '!', 2.5);
                        setTimeout(() => {
                            spawnTanks(4 + state.level * 2);
                        }, 1500);
                    }
                } else {
                    burst(t.x, t.y, '#f1c40f', 6);
                    beep(500, 0.05, 'square', 0.04);
                }
                break;
            }
        }
    }

    // Xử lý đạn tank địch bắn trúng người chơi
    for (let i = tBullets.length - 1; i >= 0; i--) {
        let tb = tBullets[i];
        tb.x += tb.vx * dt; tb.y += tb.vy * dt; tb.life -= dt;
        if (tb.life <= 0) { tBullets.splice(i, 1); continue; }

        if (helicopter && !helicopter.landed) {
            if (Math.hypot(tb.x - helicopter.x, tb.y - helicopter.y) < helicopter.size + tb.r) {
                tBullets.splice(i, 1);
                helicopter.hp -= 20;
                burst(helicopter.x, helicopter.y, '#ff3b3b', 8);
                beep(220, 0.1, 'sawtooth', 0.08);

                // Cạn HP -> Trừ 1 Level, hồi máu
                if (helicopter.hp <= 0) {
                    helicopter.hp = helicopter.maxHp;
                    if (state.level > 1) {
                        state.level--;
                        showMsg('💥 BỊ HẠ GỤC! Giảm xuống Cấp độ ' + state.level, 2.5);
                    } else {
                        showMsg('💥 BỊ HẠ GỤC! Cố gắng né đạn nhé!', 2.0);
                    }
                    document.getElementById('levelTxt').textContent = state.level;
                }
            }
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#27ae60';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (helicopter) {
        ctx.translate(W / 2 - helicopter.x, H / 2 - helicopter.y);
    }

    for (let lake of lakes) {
        ctx.fillStyle = '#2980b9'; ctx.strokeStyle = '#1b4f72'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(lake.x, lake.y, lake.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }

    for (let m of mountains) {
        ctx.fillStyle = '#7f8c8d'; ctx.strokeStyle = '#34495e'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#bdc3c7';
        ctx.beginPath(); ctx.arc(m.x - 20, m.y - 20, m.r * 0.4, 0, Math.PI * 2); ctx.fill();
    }

    ctx.fillStyle = '#f1c40f';
    ctx.beginPath(); ctx.arc(baseIsland.x, baseIsland.y, baseIsland.r, 0, Math.PI * 2); ctx.fill();

    for (let t of tanks) {
        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.fillStyle = t.color;
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
        ctx.fillRect(-18, -14, 36, 28);
        ctx.strokeRect(-18, -14, 36, 28);
        
        ctx.rotate(t.turretAngle);
        ctx.fillStyle = '#444';
        ctx.fillRect(0, -4, 25, 8);
        ctx.restore();
    }

    if (helicopter) drawAvatarJet(helicopter);

    for (let id in otherPlayers) {
        let p = otherPlayers[id];
        drawOtherAvatarJet(p);
    }

    ctx.fillStyle = '#00ffcc';
    for (let b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#ff3b3b';
    for (let b of tBullets) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); }

    for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();
}

function drawJetShape(colorPrimary, colorSecondary, scale = 1) {
    ctx.save();
    ctx.scale(scale, scale);
    const s = 26;

    ctx.fillStyle = colorSecondary;
    ctx.beginPath();
    ctx.moveTo(-s * 0.3, s * 0.6); ctx.lineTo(-s * 0.6, s * 1.1); ctx.lineTo(-s * 0.1, s * 0.8); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(s * 0.3, s * 0.6); ctx.lineTo(s * 0.6, s * 1.1); ctx.lineTo(s * 0.1, s * 0.8); ctx.closePath(); ctx.fill();

    ctx.fillStyle = colorPrimary;
    ctx.beginPath();
    ctx.moveTo(0, -s * 1.2); ctx.lineTo(-s * 1.3, s * 0.3); ctx.lineTo(-s * 0.3, s * 0.2); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, -s * 1.2); ctx.lineTo(s * 1.3, s * 0.3); ctx.lineTo(s * 0.3, s * 0.2); ctx.closePath(); ctx.fill();

    ctx.fillStyle = colorSecondary; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -s * 1.3); ctx.lineTo(-s * 0.3, s * 0.8); ctx.lineTo(s * 0.3, s * 0.8); ctx.closePath(); ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#38bdf8"; ctx.shadowBlur = 10; ctx.shadowColor = "#38bdf8";
    ctx.beginPath(); ctx.ellipse(0, -s * 0.2, s * 0.15, s * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
}

function drawAvatarJet(h) {
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(h.angle + Math.PI / 2);
    
    // Vẽ máy bay chính
    drawJetShape(h.primaryColor, h.secondaryColor, 1);

    // Vẽ đội hình phân thân (Wingman) theo cấp độ
    let config = getLevelParameters(state.level);
    let wingmanCount = config.wingman;
    if (wingmanCount >= 1) {
        ctx.save(); ctx.translate(-45, 25); drawJetShape(h.primaryColor, h.secondaryColor, 0.65); ctx.restore();
    }
    if (wingmanCount >= 2) {
        ctx.save(); ctx.translate(45, 25); drawJetShape(h.primaryColor, h.secondaryColor, 0.65); ctx.restore();
    }
    if (wingmanCount >= 3) {
        ctx.save(); ctx.translate(0, 60); drawJetShape(h.primaryColor, h.secondaryColor, 0.65); ctx.restore();
    }

    ctx.restore();

    // Hiển thị Tên, Cấp độ và Thanh HP ngay trên máy bay
    ctx.save();
    ctx.translate(h.x, h.y - 40);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(-65, -18, 130, 24);
    ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 1.5; ctx.strokeRect(-65, -18, 130, 24);
    
    let hpPercent = Math.max(0, h.hp / h.maxHp);
    ctx.fillStyle = '#333'; ctx.fillRect(-55, -4, 110, 4);
    ctx.fillStyle = hpPercent > 0.5 ? '#2ecc71' : (hpPercent > 0.2 ? '#f1c40f' : '#e74c3c');
    ctx.fillRect(-55, -4, 110 * hpPercent, 4);

    ctx.fillStyle = '#ff00ff'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
    ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 4;
    ctx.fillText(h.name + ' (Lv.' + state.level + ')', 0, -8);
    ctx.restore();
}

function drawOtherAvatarJet(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle + Math.PI / 2);
    let pCol = p.primaryColor || '#3498db';
    let sCol = p.secondaryColor || '#ffffff';
    drawJetShape(pCol, sCol, 1);
    ctx.restore();

    ctx.save();
    ctx.translate(p.x, p.y - 40);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; ctx.fillRect(-55, -18, 110, 24);
    ctx.strokeStyle = pCol; ctx.lineWidth = 1; ctx.strokeRect(-55, -18, 110, 24);

    let opHp = p.hp !== undefined ? p.hp : 100;
    ctx.fillStyle = '#333'; ctx.fillRect(-45, -4, 90, 4);
    ctx.fillStyle = '#2ecc71'; ctx.fillRect(-45, -4, 90 * (opHp / 100), 4);

    ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
    ctx.fillText((p.name || 'Pilots') + ' (Lv.' + (p.level || 1) + ')', 0, -8);
    ctx.restore();
}

function drawRadar() {
    radarCtx.clearRect(0, 0, 120, 120);
    if (!helicopter) return;

    let scaleX = 120 / WORLD_WIDTH;
    let scaleY = 120 / WORLD_HEIGHT;

    radarCtx.fillStyle = '#2980b9';
    for (let l of lakes) {
        radarCtx.beginPath(); radarCtx.arc(l.x * scaleX, l.y * scaleY, l.r * scaleX, 0, Math.PI * 2); radarCtx.fill();
    }
    radarCtx.fillStyle = '#7f8c8d';
    for (let m of mountains) {
        radarCtx.beginPath(); radarCtx.arc(m.x * scaleX, m.y * scaleY, m.r * scaleX, 0, Math.PI * 2); radarCtx.fill();
    }
    for (let t of tanks) {
        radarCtx.fillStyle = '#ff3b3b';
        radarCtx.fillRect(t.x * scaleX - 2, t.y * scaleY - 2, 4, 4);
    }
    for (let id in otherPlayers) {
        let p = otherPlayers[id];
        radarCtx.fillStyle = '#3498db';
        radarCtx.fillRect(p.x * scaleX - 2, p.y * scaleY - 2, 4, 4);
    }
    radarCtx.fillStyle = '#00ff00';
    radarCtx.beginPath(); radarCtx.arc(helicopter.x * scaleX, helicopter.y * scaleY, 4, 0, Math.PI * 2); radarCtx.fill();
}

// BẢNG XẾP HẠNG ĐỘNG
function updateLeaderboardUI() {
    let playersList = [
        { name: playerName + ' (Bạn)', level: state.level, isPlayer: true }
    ];

    for (let id in otherPlayers) {
        let op = otherPlayers[id];
        playersList.push({ name: op.name || 'Pilots', level: Number(op.level) || 1, isPlayer: false });
    }

    playersList.sort((a, b) => b.level - a.level);

    let listHTML = '';
    playersList.slice(0, 5).forEach((p, index) => {
        let crown = (index === 0) ? '👑 ' : '';
        let colorStyle = (index === 0) ? 'color:#ffe94d; font-weight:bold;' : 'color:#fff;';
        let levelColor = p.isPlayer ? '#00ffc8' : '#ff00ff';
        
        listHTML += `<div class="lb-row" style="${colorStyle}"><span>${crown}${p.name}</span><span style="color:${levelColor};">Lv. ${p.level}</span></div>`;
    });

    document.getElementById('lbContent').innerHTML = listHTML;
}

function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
        let a = Math.random() * Math.PI * 2;
        let sp = 60 + Math.random() * 150;
        particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, r: 2 + Math.random() * 3, color, life: 0.6 });
    }
}

function showMsg(text, sec) { 
    document.getElementById('bigmsg').textContent = text; 
    setTimeout(() => { document.getElementById('bigmsg').textContent = ''; }, sec * 1000); 
}

const input = { left: false, right: false, firePressed: false };
let isFiring = false;

window.addEventListener('keydown', e => {
    let k = e.key.toLowerCase();
    if (k === 'a') input.left = true;
    if (k === 'd') input.right = true;
    if (k === 'w' && helicopter) helicopter.speed = Math.min(helicopter.maxSpeed, helicopter.speed + 0.2);
    if (k === 's' && helicopter) helicopter.speed = Math.max(-0.2, helicopter.speed - 0.2);
    if (e.code === 'Space') { 
        e.preventDefault(); 
        input.firePressed = true; 
        isFiring = true;
        shootBullet(); 
    }
});
window.addEventListener('keyup', e => {
    let k = e.key.toLowerCase();
    if (k === 'a') input.left = false;
    if (k === 'd') input.right = false;
    if (e.code === 'Space') {
        isFiring = false;
    }
});

function bindHold(el, onDown, onUp) {
    el.addEventListener('touchstart', e => { e.preventDefault(); el.classList.add('active'); onDown(); }, {passive:false});
    el.addEventListener('touchend', e => { e.preventDefault(); el.classList.remove('active'); if(onUp) onUp(); }, {passive:false});
    el.addEventListener('touchcancel', e => { e.preventDefault(); el.classList.remove('active'); if(onUp) onUp(); }, {passive:false});
    el.addEventListener('mousedown', e => { e.preventDefault(); el.classList.add('active'); onDown(); });
    el.addEventListener('mouseup', e => { e.preventDefault(); el.classList.remove('active'); if(onUp) onUp(); });
}
function bindTap(el, fn) {
    el.addEventListener('touchstart', e => { e.preventDefault(); el.classList.add('active'); fn(); }, {passive:false});
    el.addEventListener('touchend', e => { e.preventDefault(); el.classList.remove('active'); }, {passive:false});
    el.addEventListener('mousedown', e => { e.preventDefault(); el.classList.add('active'); fn(); });
    el.addEventListener('mouseup', e => { e.preventDefault(); el.classList.remove('active'); });
}

bindHold(document.getElementById('btnA'), () => input.left = true, () => input.left = false);
bindHold(document.getElementById('btnD'), () => input.right = true, () => input.right = false);
bindTap(document.getElementById('btnSpeedUp'), () => { if (helicopter) helicopter.speed = Math.min(helicopter.maxSpeed, helicopter.speed + 0.25); });
bindTap(document.getElementById('btnSpeedDown'), () => { if (helicopter) helicopter.speed = Math.max(-0.2, helicopter.speed - 0.25); });

const fireBtn = document.getElementById('btnFire');
bindHold(fireBtn, () => {
    if (!state.running) return;
    input.firePressed = true;
    isFiring = true;
    shootBullet();
}, () => {
    isFiring = false;
});

function startGame(mode) {
    initAudio();
    gameMode = mode;
    
    let rawInput = document.getElementById('playerNameInput').value.trim();
    if (rawInput !== '') playerName = rawInput;

    state.running = true;
    state.flowStarted = false;
    state.level = 1;
    killsCount = 0;
    document.getElementById('levelTxt').textContent = state.level;
    
    helicopter = makeHelicopter();
    tanks = []; bullets = []; tBullets = [];

    if (mode === 'multi') {
        socket = io();
        socket.emit('join_game', { name: playerName, country: selectedCountry, primaryColor, secondaryColor });
        socket.on('update_players', (data) => {
            let myId = socket.id;
            otherPlayers = {};
            for (let id in data) {
                if (id !== myId) otherPlayers[id] = data[id];
            }
            updateLeaderboardUI();
        });
        showMsg('🌐 Đã kết nối phòng Thực Chiến Đồng Đội trực tuyến!', 2.5);
    } else {
        if (socket) { socket.disconnect(); socket = null; }
        otherPlayers = {};
        updateLeaderboardUI();
        showMsg('🪖 Huấn Luyện Đơn: Nhấn FIRE để cất cánh!', 2.5);
    }

    document.getElementById('overlay').style.display = 'none';
}
</script>
